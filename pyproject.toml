[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conversor-bases"
version = "0.1.0"
description = "Conversor entre bases numéricas (binario, decimal, hexadecimal)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Magdalena Rossello" },
    { name = "Augusto Castro" },
    { name = "Santiago Canedo" },
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
conversor = "conversor_bases.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
addopts = "--cov=conversor_bases --cov-report=term-missing"
testpaths = ["tests"]